- type: entity
  name: aspace radio [ADMEME]
  description: A radio with which admins mess with you.
  parent: [RadioHandheld]
  id: RadioHandheldAdmeme
  components:
    - type: TelecomExempt
    - type: RadioMicrophone
      broadcastChannel: Aspace
      listenRange: 1
    - type: RadioSpeaker
      channels:
        - Aspace
    - type: Speech
      speechVerb: Robotic
    - type: Sprite
      sprite: _Inferus/Objects/Devices/admemehandy.rsi
      layers:
        - state: walkietalkie
        - state: walkietalkie-on
      state: walkietalkie
    - type: Item
      sprite: _Inferus/Objects/Devices/admemehandy.rsi
      heldPrefix: walkietalkie
    - type: Tag
      tags:
        - Radio

- type: entity
  name: handheld station radio
  description: Listen to those sweet tunes, on the go!
  parent: [RadioHandheld]
  id: RadioHandheldStation
  components:
    - type: Sprite
      sprite: _Inferus/Objects/Devices/radiohandy.rsi
      layers:
        - state: walkietalkie
        - state: walkietalkie-on
      state: walkietalkie
    - type: Item
      sprite: _Inferus/Objects/Devices/radiohandy.rsi
      heldPrefix: walkietalkie
      size: Tiny
    - type: RadioSpeaker
      channels:
      - RadioShow
    - type: Speech
      speechVerb: Radio
    - type: ActiveRadio
      channels:
      - RadioShow
    - type: StationRadioReceiver
