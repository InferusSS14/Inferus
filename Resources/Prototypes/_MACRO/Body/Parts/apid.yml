- type: entity
  id: PartApid
  parent: [ BaseItem, BasePart ]
  name: apid body part
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: TorsoApid
  parent: [ PartApid, BaseTorso ]
  name: apid torso
  components:
  - type: Sprite
    sprite: _MACRO/Mobs/Species/Apid/parts.rsi
    state: torso

- type: entity
  id: HeadApid
  parent: [ PartApid, BaseHead ]
  name: apid head
  components:
