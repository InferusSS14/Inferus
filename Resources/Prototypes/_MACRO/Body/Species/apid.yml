- type: entity
  parent: [ BaseSpeciesDummy, BaseInventoryApid ]
  id: AppearanceApid
  categories: [ HideSpawnMenu ]
  components:
  - type: HumanoidAppearance
    species: Apid

- type: entity
  parent: [ BaseMobSpeciesOrganic, BaseSpeciesPickupableLarge, BaseInventoryApid ]
  id: MobApid
  name: Urist McBzzsz
  components:
  - type: HumanoidAppearance
    species: Apid
    hideLayersOnEquip:
    - HeadTop
    - Hair
  - type: Icon
    sprite: _MACRO/Mobs/Species/Apid/parts.rsi
    state: full
  - type: Body
    prototype: Apid
    requiredLegs: 2
  - type: Damageable
    damageModifierSet: Moth
  - type: Speech
    speechVerb: Moth
    speechSounds: UnisexMoth
    allowedEmotes: [ Chitter, Squeak, Flap ]
  - type: TypingIndicator
    proto: apid
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: InsectBlood
        Quantity: 500
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: _MACRO/Mobs/Effects/apid_brute_damage.rsi
        color: "#808A51"
  - type: MothAccent
  - type: Vocal
  - type: BodyEmotes
    soundsId: MothBodyEmotes
  - type: MobThresholds
    thresholds:
      0: Alive
      60: Critical
      125: Dead
  - type: Temperature
    currentTemperature: 310.15
    specificHeat: 46
  - type: TemperatureDamage
    heatDamageThreshold: 320
    coldDamageThreshold: 230
    coldDamage:
      types:
        Cold: 0.05
    heatDamage:
      types:
        Heat: 3
  - type: TemperatureSpeed
    thresholds:
      289: 0.9
      275: 0.8
      250: 0.7
  - type: MovementSpeedModifier
    baseWeightlessFriction: 0.2
    baseWeightlessModifier: 1
    baseWeightlessAcceleration: 1.2
    baseSprintSpeed: 5.5
    baseWalkSpeed: 3.5
  - type: MovementIgnoreGravity
    weightless: true
  - type: MeleeWeapon
    attackRate: 1
    soundHit:
      collection: Punch
    angle: 30
    animation: WeaponArcThrust
    damage:
      types:
        Shock: 3
  - type: StaminaDamageOnHit
    damage: 18
  - type: FireVisuals
    sprite: Mobs/Effects/onfire.rsi
    normalState: Monkey_burning
  - type: Tag
    tags:
    - VimPilot
    - DoorBumpOpener
    - AnomalyHost
    - CanPilot
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 75
        restitution: 0.0
        mask:
        - CrateMask
        layer:
        - MobLayer
  - type: Physics
    bodyStatus: InAir
  - type: NoSlip
  - type: CanMoveInAir
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    layers:
